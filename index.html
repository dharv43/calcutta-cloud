<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calcutta</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC_COaEqzwvMRTdfnJAwA3z6ecVBIeKHmo",
  authDomain: "pga-championship-calcutta.firebaseapp.com",
  databaseURL: "https://pga-championship-calcutta-default-rtdb.firebaseio.com",
  projectId: "pga-championship-calcutta",
  storageBucket: "pga-championship-calcutta.firebasestorage.app",
  messagingSenderId: "166207526746",
  appId: "1:166207526746:web:67cebcc535d227ea360563"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0d14;
  --surf:#111520;
  --s2:#171d2e;
  --s3:#1d2540;
  --bdr:#252f4a;
  --bdr2:#2e3a58;
  --text:#eef0ff;
  --dim:#6b778f;
  --dim2:#3d4a66;
  --teal:#00d4aa;
  --teal-d:#00a884;
  --teal-g:rgba(0,212,170,.12);
  --blue:#6366f1;
  --blue-g:rgba(99,102,241,.12);
  --amber:#f59e0b;
  --grn:#10b981;
  --red:#ef4444;
}
html{font-size:16px;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4;
}
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(99,102,241,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,.03) 1px, transparent 1px);
  background-size:60px 60px;
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,170,.4)}70%{box-shadow:0 0 0 12px rgba(0,212,170,0)}}

/* NAV */
nav{
  display:flex;align-items:center;justify-content:flex-end;
  padding:20px 48px;
  border-bottom:1px solid var(--bdr);
  background:rgba(10,13,20,.8);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.nav-right{display:flex;align-items:center;gap:16px;}
.comm-panel-toggle{
  font-size:11px;font-weight:700;letter-spacing:.5px;
  color:var(--dim2);border:1px solid var(--bdr);border-radius:6px;
  padding:5px 12px;background:none;cursor:pointer;transition:all .15s;
  display:none;
}
.comm-panel-toggle:hover{color:var(--text);border-color:var(--bdr2);}

/* HERO */
.hero{
  display:flex;flex-direction:column;align-items:center;
  padding:80px 48px 64px;
  text-align:center;
  max-width:960px;
  margin:0 auto;
}
.hero-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:112px;line-height:.95;
  letter-spacing:4px;
  margin-bottom:0;
  animation:fadeUp .6s .1s ease both;
}
.hero-title .line1{color:var(--text);}
.hero-title .line2{color:var(--teal);}

/* EVENTS SECTION */
.events-section{
  max-width:960px;margin:0 auto;
  padding:0 48px 80px;
}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--dim2);margin-bottom:24px;
  animation:fadeUp .6s .3s ease both;opacity:0;animation-fill-mode:forwards;
}

/* EVENT CARD */
.event-card{
  background:var(--surf);
  border:1px solid var(--bdr2);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.02);
  animation:fadeUp .6s .35s ease both;opacity:0;animation-fill-mode:forwards;
  transition:border-color .2s, box-shadow .2s;
}
.event-card:hover{
  border-color:rgba(0,212,170,.3);
  box-shadow:0 32px 80px rgba(0,0,0,.5), 0 0 40px rgba(0,212,170,.06);
}
.event-card-top{
  padding:36px 40px 28px;
  background:linear-gradient(135deg, var(--s3), var(--s2));
  border-bottom:1px solid var(--bdr);
  position:relative;overflow:hidden;
  display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
}
.event-card-top::before{
  content:'';position:absolute;top:-80px;right:-80px;
  width:320px;height:320px;
  background:radial-gradient(circle, rgba(0,212,170,.08), transparent 65%);
  pointer-events:none;
}
.event-meta{}
.event-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--blue-g);border:1px solid rgba(99,102,241,.3);
  border-radius:6px;padding:4px 12px;
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:#818cf8;margin-bottom:14px;
}
.event-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:52px;letter-spacing:1px;color:var(--text);line-height:1;
  margin-bottom:8px;
}
.event-subtitle{
  font-size:15px;color:var(--dim);font-weight:600;letter-spacing:.3px;
}
.event-status-wrap{
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;
  padding-top:4px;
}
.status-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
}
.status-coming-soon{
  background:rgba(107,119,143,.12);
  border:1px solid rgba(107,119,143,.3);
  color:var(--dim);
}
.status-live{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.3);
  color:var(--red);
  animation:blink .9s infinite;
}
.status-paused{
  background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.3);
  color:var(--amber);
  animation:blink .9s infinite;
}
.status-complete{
  background:rgba(16,185,129,.1);
  border:1px solid rgba(16,185,129,.3);
  color:var(--grn);
}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

.event-card-body{
  padding:28px 40px 32px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
.event-stats{display:flex;gap:32px;flex-wrap:wrap;}
.event-stat{}
.event-stat-label{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--dim2);margin-bottom:6px;
}
.event-stat-val{
  font-size:28px;font-weight:900;color:var(--text);line-height:1;
}
.event-stat-val.teal{color:var(--teal);}
.event-stat-val.dim{color:var(--dim);}
.event-actions{display:flex;gap:12px;align-items:center;}
.btn-enter{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 28px;border-radius:10px;
  background:linear-gradient(135deg,var(--teal),var(--teal-d));
  color:#061510;font-weight:800;font-size:15px;
  text-decoration:none;letter-spacing:.3px;
  transition:filter .15s, box-shadow .15s;
  box-shadow:0 0 32px rgba(0,212,170,.2);
}
.btn-enter:hover{filter:brightness(1.08);box-shadow:0 0 48px rgba(0,212,170,.35);}
.btn-enter.disabled{
  background:var(--s3);color:var(--dim2);
  box-shadow:none;pointer-events:none;
  border:1px solid var(--bdr);
}
.btn-enter-arrow{font-size:18px;line-height:1;}

/* COMM PANEL */
.comm-panel{
  display:none;
  background:var(--s2);border:1px solid rgba(99,102,241,.3);
  border-radius:14px;padding:24px 28px;margin-top:20px;
  animation:fadeUp .2s ease;
}
.comm-panel-title{
  font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:#818cf8;margin-bottom:16px;display:flex;align-items:center;gap:8px;
}
.comm-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.comm-field{display:flex;flex-direction:column;gap:6px;}
.comm-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
.comm-select{
  background:var(--s3);border:1px solid var(--bdr);border-radius:8px;
  padding:8px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;cursor:pointer;min-width:160px;
}
.comm-select:focus{border-color:#818cf8;}
.comm-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 20px;border-radius:8px;
  background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.4);
  color:#818cf8;font-weight:700;font-size:13px;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;
}
.comm-btn:hover{background:rgba(99,102,241,.25);}
.comm-save-msg{font-size:12px;color:var(--grn);font-weight:600;display:none;}

/* FUTURE EVENTS PLACEHOLDER */
.future-section{
  max-width:960px;margin:0 auto;padding:0 48px 80px;
}
.future-card{
  background:var(--surf);border:1px dashed var(--bdr);border-radius:16px;
  padding:40px;text-align:center;color:var(--dim2);
  animation:fadeUp .6s .5s ease both;opacity:0;animation-fill-mode:forwards;
}
.future-icon{font-size:36px;margin-bottom:12px;opacity:.4;}
.future-text{font-size:14px;font-weight:600;letter-spacing:.5px;}

/* FOOTER */
footer{
  border-top:1px solid var(--bdr);padding:28px 48px;
}

@media(max-width:768px){
  nav{padding:14px 20px;}
  .hero{padding:56px 20px 48px;}
  .hero-title{font-size:72px;}
  .events-section,.future-section{padding:0 20px 56px;}
  .event-card-top{flex-direction:column;gap:16px;padding:24px 24px 20px;}
  .event-status-wrap{align-items:flex-start;}
  .event-card-body{padding:20px 24px 24px;flex-direction:column;align-items:flex-start;}
  .event-name{font-size:40px;}
  footer{padding:20px;}
}
</style>
</head>
<body>
<div class="wrap">

<nav>
  <div class="nav-right">
    <button class="comm-panel-toggle" id="comm-toggle-btn" onclick="toggleCommPanel()">⚙ Commissioner</button>
  </div>
</nav>

<div class="hero">
  <h1 class="hero-title">
    <span class="line1">CALCUTTA</span><br>
    <span class="line2">AUCTION</span>
  </h1>
</div>

<div class="events-section">

  <div class="event-card" id="event-card">
    <div class="event-card-top" style="flex-direction:column;align-items:center;text-align:center;">
      <div class="event-meta">
        <div class="event-tag">⛳ Golf · Major</div>
        <div class="event-name" style="font-size:64px;">2026 PGA Championship</div>
        <div class="event-subtitle" style="font-size:14px;">Aronimink Golf Club</div>
        <div class="event-subtitle" style="font-size:14px;margin-top:4px;">Newtown Square, PA</div>
        <div style="margin-top:14px;min-height:32px;display:flex;justify-content:center;">
          <div class="status-pill status-coming-soon" id="status-pill" style="display:none;">
            <span class="status-dot"></span>
            <span id="status-text">Coming Soon</span>
          </div>
        </div>
      </div>
    </div>

    <div class="event-card-body">
      <div class="event-stats" style="justify-content:center;width:100%;">
        <div class="event-stat" style="text-align:center;">
          <div class="event-stat-label" style="font-size:14px;">Total Pot</div>
          <div class="event-stat-val teal" id="stat-pot" style="font-size:42px;">—</div>
        </div>
        <div class="event-stat" style="text-align:center;">
          <div class="event-stat-label" style="font-size:14px;">Participants</div>
          <div class="event-stat-val" id="stat-participants" style="font-size:42px;">—</div>
        </div>
      </div>
      <div class="event-actions" style="width:100%;justify-content:center;margin-top:8px;">
        <a href="draft.html" class="btn-enter" id="enter-btn">
          Enter Draft <span class="btn-enter-arrow">→</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Commissioner panel (hidden unless ?commissioner) -->
  <div class="comm-panel" id="comm-panel">
    <div class="comm-panel-title">⚙ Commissioner Controls</div>
    <div class="comm-row">
      <div class="comm-field">
        <div class="comm-label">Draft Status</div>
        <select class="comm-select" id="comm-status-select">
          <option value="coming_soon">Coming Soon</option>
          <option value="live">🟢 Live — Open for bidding</option>
          <option value="complete">✓ Complete</option>
        </select>
      </div>
      <button class="comm-btn" onclick="saveStatus()">Save Status</button>
      <div class="comm-save-msg" id="comm-save-msg">✅ Saved!</div>
    </div>
  </div>

</div>

<footer></footer>

</div>

<script>
// ── COMM LINK PATCHER ──────────────────────────────────────────
(function(){
  const isComm = window.location.search.indexOf('commissioner') !== -1;
  if(!isComm) return;
  function patchLinks(){
    document.querySelectorAll('a[href*="draft.html"]').forEach(a=>{
      if(a.href.indexOf('commissioner')===-1){
        a.href = a.href + (a.href.indexOf('?')===-1 ? '?commissioner' : '&commissioner');
      }
    });
  }
  patchLinks();
  document.addEventListener('DOMContentLoaded', patchLinks);
  setTimeout(patchLinks, 300);
  // Show comm toggle button
  const btn = document.getElementById('comm-toggle-btn');
  if(btn) btn.style.display = 'inline-flex';
})();

// ── FIREBASE ──────────────────────────────────────────────────
function calcTax(spend, cap){
  if(spend<=cap) return 0;
  let tax=0, over=spend-cap;
  for(const [max,rate] of [[50,.5],[50,1],[50,1.5],[Infinity,2]]){
    const chunk=Math.min(over,max); tax+=chunk*rate; over-=chunk; if(over<=0) break;
  }
  return tax;
}

// Load draft state from Firebase
db.ref('draft').on('value', snap => {
  const d = snap.val();
  updateCard(d);
});

// Load hub config (commissioner-controlled status)
db.ref('hubConfig/draftStatus').on('value', snap => {
  const status = snap.val() || 'coming_soon';
  applyStatus(status);
  const sel = document.getElementById('comm-status-select');
  if(sel) sel.value = status;
});

// Auto-detect live/paused/complete from actual draft state
document.addEventListener('DOMContentLoaded', () => {
  db.ref('draft/draftStatus').on('value', snap => {
    const ds = snap.val();
    const pill = document.getElementById('status-pill');
    const txt = document.getElementById('status-text');
    if(!pill || !txt) return;
    if(ds === 'live'){
      pill.style.display = 'inline-flex';
      pill.className = 'status-pill status-live';
      txt.textContent = 'Draft Live';
    } else if(ds === 'paused'){
      pill.style.display = 'inline-flex';
      pill.className = 'status-pill status-paused';
      txt.textContent = 'Draft Paused';
    } else if(ds === 'complete'){
      pill.style.display = 'inline-flex';
      pill.className = 'status-pill status-complete';
      txt.textContent = 'Complete';
    } else {
      pill.style.display = 'none';
    }
  });
});

function applyStatus(status){
  const pill = document.getElementById('status-pill');
  const txt = document.getElementById('status-text');
  const btn = document.getElementById('enter-btn');
  if(!pill || !txt || !btn) return;

  pill.className = 'status-pill';
  if(status === 'live'){
    pill.style.display = 'inline-flex';
    pill.classList.add('status-live');
    txt.textContent = 'Auction is Live';
    btn.classList.remove('disabled');
    btn.innerHTML = '🟢 Join Live Draft <span class="btn-enter-arrow">→</span>';
    btn.style.boxShadow = '0 0 48px rgba(0,212,170,.4)';
  } else if(status === 'complete'){
    pill.style.display = 'inline-flex';
    pill.classList.add('status-complete');
    txt.textContent = 'Complete';
    btn.classList.remove('disabled');
    btn.innerHTML = 'View Results <span class="btn-enter-arrow">→</span>';
    btn.href = 'draft.html#results';
    btn.style.boxShadow = '';
  } else {
    pill.style.display = 'none';
    btn.classList.remove('disabled');
    btn.innerHTML = 'Enter Draft <span class="btn-enter-arrow">→</span>';
    btn.href = 'draft.html';
    btn.style.boxShadow = '0 0 32px rgba(0,212,170,.2)';
  }
}

function updateCard(d){
  const potEl = document.getElementById('stat-pot');
  const partEl = document.getElementById('stat-participants');
  const soldEl = document.getElementById('stat-sold');

  if(!d || !d.sold || !d.sold.length){
    if(potEl) potEl.textContent = '—';
    if(partEl) partEl.textContent = '—';
    if(soldEl) soldEl.textContent = '—';
    return;
  }

  const cap = d.config?.cap || 100;
  const mgrSpend = {};
  for(const s of d.sold) mgrSpend[s.owner] = (mgrSpend[s.owner]||0) + s.price;
  let pot = 0;
  for(const sp of Object.values(mgrSpend)) pot += sp + calcTax(sp, cap);

  if(potEl) potEl.textContent = '$' + pot.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(partEl) partEl.textContent = (d.managers||[]).filter(m=>m.name!=='Open').length;
}

// ── COMMISSIONER ──────────────────────────────────────────────
function toggleCommPanel(){
  const panel = document.getElementById('comm-panel');
  if(panel) panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function saveStatus(){
  const sel = document.getElementById('comm-status-select');
  if(!sel) return;
  db.ref('hubConfig/draftStatus').set(sel.value).then(()=>{
    const msg = document.getElementById('comm-save-msg');
    if(msg){ msg.style.display='inline'; setTimeout(()=>msg.style.display='none', 2500); }
  }).catch(e=>alert('Save failed: '+e.message));
}
</script>
</body>
</html>
